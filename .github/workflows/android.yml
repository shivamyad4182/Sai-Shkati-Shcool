name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build APK with Gradle
      run: |
        # Find directory containing gradlew and run build from there
        DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
        cd "$DIR"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sai-Shakti-School-App
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
